<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0704">
<meta http-equiv="Permissions-Policy" content="camera=(self), xr-spatial-tracking=(self)">
<title>Place on table — Hungry Birds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--orange:#ff8a00;--amber:#ffc247}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#090704;color:#fff8ee;font-family:Manrope,system-ui,sans-serif;overflow:hidden}
h1,h2{font-family:Syne,sans-serif}
#canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#overlay{position:fixed;inset:0;pointer-events:none;z-index:5}
#overlay *{pointer-events:auto}
.top{
  position:absolute;left:0;right:0;top:0;padding:14px 16px;
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:linear-gradient(#000c,#0000);padding-top:max(14px,env(safe-area-inset-top));
}
.back,.ghost{
  border:1px solid #ffffff22;background:#0008;color:#fff;border-radius:999px;
  padding:10px 14px;font-weight:800;text-decoration:none;font-size:13px
}
.title{font-weight:800;font-size:15px;text-align:center}
.panel{
  position:absolute;left:50%;transform:translateX(-50%);
  width:min(420px,calc(100% - 24px));bottom:max(18px,env(safe-area-inset-bottom));
  background:#120e0ce8;border:1px solid #3a2c1d;border-radius:22px;padding:16px;
  backdrop-filter:blur(12px)
}
.panel h2{margin:0 0 6px;font-size:20px}
.panel p{margin:0 0 12px;color:#d8c4aa;font-size:13px;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  border:0;border-radius:999px;padding:13px 16px;font-weight:800;cursor:pointer;
  flex:1;min-width:140px;font:inherit
}
.btn.go{background:linear-gradient(135deg,#fff,#ffe0a8);color:#1a1006}
.btn.alt{background:#1a140f;color:#fff;border:1px solid #3d2f20}
.hint{
  position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);
  text-align:center;width:min(320px,90%);display:none
}
.hint.show{display:block}
.ring{
  width:86px;height:86px;margin:0 auto 12px;border-radius:50%;
  border:3px solid #ffc247;box-shadow:0 0 0 10px #ffc24722;animation:pulse 1.6s infinite
}
@keyframes pulse{50%{transform:scale(.92);opacity:.7}}
.status{font-size:12px;color:#ffd9a0;margin-top:8px;min-height:16px}
.warn{color:#ffb36a;font-size:12px;line-height:1.45;display:none}
.warn.show{display:block}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="overlay">
  <div class="top">
    <a class="back" href="index.html">← Menu</a>
    <div class="title" id="dishTitle">AR table</div>
    <button class="ghost" id="resetBtn" type="button">Reset</button>
  </div>
  <div class="hint" id="scanHint">
    <div class="ring"></div>
    <div>Move the phone over the table, then tap to set the dish down.</div>
  </div>
  <div class="panel" id="panel">
    <h2 id="panelTitle">See it on your table</h2>
    <p id="panelCopy">The 3D dish is ready. Tap the orange button, allow the camera, then tap the table.</p>
    <div class="row">
      <button class="btn go" id="startBtn" type="button">Start camera AR</button>
      <button class="btn alt" id="sceneBtn" type="button">Android AR app</button>
    </div>
    <div class="status" id="status">Ready</div>
    <div class="warn" id="warn"></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const MENU = {
  pizza: { name: 'Margherita Pizza', file: 'colored_pizza.glb', yLift: 0.002 },
  burger: { name: 'Classic Burger', file: 'burger.glb', yLift: 0.002 }
};

const params = new URLSearchParams(location.search);
const item = MENU[params.get('dish')] || MENU.pizza;
document.getElementById('dishTitle').textContent = item.name;
document.getElementById('panelTitle').textContent = item.name;

const canvas = document.getElementById('canvas');
const statusEl = document.getElementById('status');
const warnEl = document.getElementById('warn');
const hintEl = document.getElementById('scanHint');
const panelEl = document.getElementById('panel');
const startBtn = document.getElementById('startBtn');
const sceneBtn = document.getElementById('sceneBtn');
const resetBtn = document.getElementById('resetBtn');

const isAndroid = /Android/i.test(navigator.userAgent);
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isSecure = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';

function setStatus(t){ statusEl.textContent = t; }
function setWarn(t){ warnEl.textContent = t; warnEl.classList.toggle('show', !!t); }

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local');
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c0906);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.01, 30);
camera.position.set(0.18, 0.16, 0.28);

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 0.04, 0);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xfff4e5, 0x2a1c10, 1.3));
const key = new THREE.DirectionalLight(0xffffff, 1.1);
key.position.set(0.4, 0.8, 0.3);
scene.add(key);
scene.add(new THREE.AmbientLight(0xffe0b0, 0.35));

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(0.22, 48),
  new THREE.MeshStandardMaterial({ color: 0x1a140f, roughness: 0.9, metalness: 0 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const reticle = new THREE.Mesh(
  new THREE.RingGeometry(0.04, 0.052, 32).rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({ color: 0xffc247 })
);
reticle.matrixAutoUpdate = false;
reticle.visible = false;
scene.add(reticle);

let dish = new THREE.Group();
scene.add(dish);
let placed = false;
let hitSource = null;
let viewerSpace = null;
let previewOnCamera = true;

const loader = new GLTFLoader();
loader.load(item.file, (gltf) => {
  dish.add(gltf.scene);
  gltf.scene.traverse((n) => {
    if (n.isMesh) {
      n.frustumCulled = false;
      n.castShadow = true;
      if (n.material) {
        n.material.side = THREE.DoubleSide;
        n.material.depthWrite = true;
      }
    }
  });
  setStatus('3D loaded — tap Start camera AR');
}, undefined, () => {
  setWarn('Could not load the 3D file. Keep the .glb next to this page.');
});

function modelURL() {
  return new URL(item.file, location.href).href;
}

async function detect() {
  let webxr = false;
  try { webxr = !!(navigator.xr && await navigator.xr.isSessionSupported('immersive-ar')); } catch {}
  if (!isSecure) {
    setWarn('Camera AR needs https. Publish this folder, then open the link on your phone.');
    startBtn.disabled = true;
    return;
  }
  if (webxr) {
    setStatus('Camera AR is available on this phone');
    return;
  }
  if (isAndroid) {
    setStatus('Use Android AR app if camera AR is blocked');
    setWarn('If the camera page stays black, tap Android AR app. That opens Google Scene Viewer.');
    return;
  }
  if (isIOS) {
    setStatus('iPhone preview is 3D here');
    setWarn('iPhone camera AR needs Apple Quick Look. Use the 3D view, or try an Android phone for the table camera.');
    startBtn.textContent = 'Try camera anyway';
    return;
  }
  setWarn('Open this page on a phone. Desktop can only spin the 3D model.');
}

detect();

startBtn.addEventListener('click', startAR);
resetBtn.addEventListener('click', () => {
  placed = false;
  previewOnCamera = true;
  reticle.visible = false;
  setStatus('Tap the table to place again');
});

function sceneViewerURL() {
  const file = modelURL();
  if (!file.startsWith('https://')) return null;
  return 'https://arvr.google.com/scene-viewer/1.0?mode=ar_preferred&title=' +
    encodeURIComponent(item.name) + '&file=' + encodeURIComponent(file);
}

function launchSceneViewer(reason = '') {
  const url = sceneViewerURL();
  if (!url) {
    setWarn('Android AR fallback needs the 3D model on a public https link.');
    return false;
  }
  if (!isAndroid) {
    setWarn(reason || 'WebXR is unavailable on this device. Use the 3D preview instead.');
    return false;
  }
  setStatus('Opening Android AR fallback…');
  setWarn('WebXR could not start, so Android AR is opening automatically.');
  window.setTimeout(() => { location.href = url; }, 350);
  return true;
}

sceneBtn.addEventListener('click', () => launchSceneViewer());

async function requestARSession() {
  // First try the normal WebXR configuration with DOM overlay.
  try {
    return await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['hit-test'],
      optionalFeatures: ['dom-overlay'],
      domOverlay: { root: document.getElementById('overlay') }
    });
  } catch (firstError) {
    // Some Android/WebXR combinations reject DOM overlay even though hit-test works.
    // Retry with only the feature the app truly needs.
    try {
      return await navigator.xr.requestSession('immersive-ar', {
        requiredFeatures: ['hit-test']
      });
    } catch (secondError) {
      secondError._firstWebXRError = firstError;
      throw secondError;
    }
  }
}

async function startAR() {
  if (!isSecure) {
    setWarn('Camera AR needs https. Publish this folder, then open the link on your phone.');
    return;
  }
  if (!navigator.xr) {
    if (launchSceneViewer('This browser has no WebXR. Opening Android AR fallback…')) return;
    return;
  }

  setStatus('Asking for camera…');
  setWarn('');

  try {
    const session = await requestARSession();
    scene.background = null;
    floor.visible = false;
    previewOnCamera = true;
    placed = false;
    hintEl.classList.add('show');
    panelEl.style.display = 'none';
    renderer.xr.setSession(session);
    setStatus('Camera on — move over a table');

    session.addEventListener('end', () => {
      hitSource = null;
      scene.background = new THREE.Color(0x0c0906);
      floor.visible = true;
      hintEl.classList.remove('show');
      panelEl.style.display = '';
      dish.position.set(0, 0, 0);
      dish.quaternion.identity();
      camera.position.set(0.18, 0.16, 0.28);
      setStatus('AR closed');
    });

    session.addEventListener('select', () => {
      if (reticle.visible) {
        dish.position.setFromMatrixPosition(reticle.matrix);
        dish.position.y += item.yLift;
        const rot = new THREE.Quaternion();
        rot.setFromRotationMatrix(reticle.matrix);
        dish.quaternion.copy(rot);
        placed = true;
        previewOnCamera = false;
        setStatus('Placed on the table — walk around it');
      } else {
        placed = true;
        previewOnCamera = false;
        setStatus('Locked in front of you — move around');
      }
    });

    try {
      viewerSpace = await session.requestReferenceSpace('viewer');
      hitSource = await session.requestHitTestSource({ space: viewerSpace });
    } catch (hitError) {
      // A session without hit-test cannot do table placement reliably.
      try { await session.end(); } catch {}
      hitSource = null;
      throw new Error('Surface hit-test is unavailable on this device.');
    }
  } catch (err) {
    console.warn('WebXR AR failed:', err);
    setStatus('WebXR unavailable');

    // Android gets an automatic Scene Viewer fallback. Other devices keep the
    // useful 3D preview and explain why camera AR could not start.
    if (isAndroid) {
      launchSceneViewer('WebXR could not start. Opening Android AR fallback…');
    } else {
      setWarn('Camera AR could not start on this device. The 3D preview still works; try Android Chrome for tabletop AR.');
    }
  }
}

const previewOffset = new THREE.Vector3(0, -0.12, -0.42);
const _pos = new THREE.Vector3();
const _quat = new THREE.Quaternion();
const _scale = new THREE.Vector3();
const _mat = new THREE.Matrix4();

renderer.setAnimationLoop((time, frame) => {
  if (!renderer.xr.isPresenting) controls.update();

  if (frame && renderer.xr.isPresenting) {
    const refSpace = renderer.xr.getReferenceSpace();
    let gotHit = false;
    if (hitSource && refSpace) {
      const hits = frame.getHitTestResults(hitSource);
      if (hits.length) {
        const pose = hits[0].getPose(refSpace);
        if (pose) {
          reticle.visible = true;
          reticle.matrix.fromArray(pose.transform.matrix);
          gotHit = true;
          if (!placed) setStatus('Surface found — tap to set it down');
        }
      }
    }
    if (!gotHit) reticle.visible = false;

    if (!placed && previewOnCamera) {
      const xrCam = renderer.xr.getCamera();
      xrCam.matrixWorld.decompose(_pos, _quat, _scale);
      const forward = previewOffset.clone().applyQuaternion(_quat);
      dish.position.copy(_pos).add(forward);
      dish.quaternion.copy(_quat);
    }
  }

  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
