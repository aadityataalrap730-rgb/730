<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0704">
<meta http-equiv="Permissions-Policy" content="camera=(self), xr-spatial-tracking=(self)">
<title>Place on table — Hungry Birds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--orange:#ff8a00;--amber:#ffc247}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#090704;color:#fff8ee;font-family:Manrope,system-ui,sans-serif;overflow:hidden}
h1,h2{font-family:Syne,sans-serif}
#cameraVideo{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;display:none;background:#000;z-index:0;transform:scaleX(1)}
#canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;z-index:1}
#overlay{position:fixed;inset:0;pointer-events:none;z-index:5}
#overlay *{pointer-events:auto}
.top{
  position:absolute;left:0;right:0;top:0;padding:14px 16px;
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:linear-gradient(#000c,#0000);padding-top:max(14px,env(safe-area-inset-top));
}
.back,.ghost{
  border:1px solid #ffffff22;background:#0008;color:#fff;border-radius:999px;
  padding:10px 14px;font-weight:800;text-decoration:none;font-size:13px
}
.title{font-weight:800;font-size:15px;text-align:center}
.panel{
  position:absolute;left:50%;transform:translateX(-50%);
  width:min(420px,calc(100% - 24px));bottom:max(18px,env(safe-area-inset-bottom));
  background:#120e0ce8;border:1px solid #3a2c1d;border-radius:22px;padding:16px;
  backdrop-filter:blur(12px)
}
.panel h2{margin:0 0 6px;font-size:20px}
.panel p{margin:0 0 12px;color:#d8c4aa;font-size:13px;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  border:0;border-radius:999px;padding:13px 16px;font-weight:800;cursor:pointer;
  flex:1;min-width:140px;font:inherit
}
.btn.go{background:linear-gradient(135deg,#fff,#ffe0a8);color:#1a1006}
.btn.alt{background:#1a140f;color:#fff;border:1px solid #3d2f20}
.hint{
  position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);
  text-align:center;width:min(320px,90%);display:none
}
.hint.show{display:block;pointer-events:none}.hint.show *{pointer-events:none}
.ring{
  width:86px;height:86px;margin:0 auto 12px;border-radius:50%;
  border:3px solid #ffc247;box-shadow:0 0 0 10px #ffc24722;animation:pulse 1.6s infinite
}
@keyframes pulse{50%{transform:scale(.92);opacity:.7}}
.status{font-size:12px;color:#ffd9a0;margin-top:8px;min-height:16px}
.warn{color:#ffb36a;font-size:12px;line-height:1.45;display:none}
.warn.show{display:block}.diag{font-size:11px;color:#cbb79e;margin-top:8px;line-height:1.45}.ok{color:#9fe7b0}.bad{color:#ff9b7a}
</style>
</head>
<body>
<video id="cameraVideo" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="overlay">
  <div class="top">
    <a class="back" href="index.html">← Menu</a>
    <div class="title" id="dishTitle">AR table</div>
    <button class="ghost" id="resetBtn" type="button">Reset</button>
  </div>
  <div class="hint" id="scanHint">
    <div class="ring"></div>
    <div>Move the phone over the table, then tap to set the dish down.</div>
  </div>
  <div class="panel" id="panel">
    <h2 id="panelTitle">See it on your table</h2>
    <p id="panelCopy">The 3D dish is ready. Tap the orange button, allow the camera, then tap the table.</p>
    <div class="row">
      <button class="btn go" id="startBtn" type="button">Start camera AR</button>
      <button class="btn alt" id="sceneBtn" type="button">Open camera mode</button>
    </div>
    <div class="status" id="status">Ready</div>
    <div class="row" id="cameraControls" style="display:none;margin-top:8px"><button class="btn alt" id="smallerBtn" type="button">−</button><button class="btn alt" id="largerBtn" type="button">+</button></div>
    <div class="warn" id="warn"></div><div class="diag" id="diag"></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const MENU = {
  pizza: { name: 'Margherita Pizza', file: 'colored_pizza.glb', yLift: 0.002 },
  burger: { name: 'Classic Burger', file: 'burger.glb', yLift: 0.002 }
};

const params = new URLSearchParams(location.search);
const item = MENU[params.get('dish')] || MENU.pizza;
document.getElementById('dishTitle').textContent = item.name;
document.getElementById('panelTitle').textContent = item.name;

const canvas = document.getElementById('canvas');
const cameraVideo = document.getElementById('cameraVideo');
const cameraControls = document.getElementById('cameraControls');
const smallerBtn = document.getElementById('smallerBtn');
const largerBtn = document.getElementById('largerBtn');
const statusEl = document.getElementById('status');
const warnEl = document.getElementById('warn');
const diagEl = document.getElementById('diag');
const hintEl = document.getElementById('scanHint');
const panelEl = document.getElementById('panel');
const startBtn = document.getElementById('startBtn');
const sceneBtn = document.getElementById('sceneBtn');
const resetBtn = document.getElementById('resetBtn');

const isAndroid = /Android/i.test(navigator.userAgent);
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isSecure = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';

function setStatus(t){ statusEl.textContent = t; }
function setWarn(t){ warnEl.textContent = t; warnEl.classList.toggle('show', !!t); }

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local');
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c0906);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.01, 30);
camera.position.set(0.18, 0.16, 0.28);

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 0.04, 0);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xfff4e5, 0x2a1c10, 1.3));
const key = new THREE.DirectionalLight(0xffffff, 1.1);
key.position.set(0.4, 0.8, 0.3);
scene.add(key);
scene.add(new THREE.AmbientLight(0xffe0b0, 0.35));

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(0.22, 48),
  new THREE.MeshStandardMaterial({ color: 0x1a140f, roughness: 0.9, metalness: 0 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const reticle = new THREE.Mesh(
  new THREE.RingGeometry(0.04, 0.052, 32).rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({ color: 0xffc247 })
);
reticle.matrixAutoUpdate = false;
reticle.visible = false;
scene.add(reticle);

let dish = new THREE.Group();
scene.add(dish);
let placed = false;
let hitSource = null;
let viewerSpace = null;
let latestHit = null;
let refSpaceForHit = null;
let xrAnchor = null;
let previewOnCamera = true;
let cameraStream = null;
let browserCameraMode = false;
let browserScale = 1;
let dishReady = false;
let dishBaseSize = 1;
const browserPlacePlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0.82);
const browserRaycaster = new THREE.Raycaster();
const browserPointer = new THREE.Vector2();

const loader = new GLTFLoader();
loader.load(item.file, (gltf) => {
  const model = gltf.scene;
  dish.add(model);

  // Normalize every model so both the pizza and burger have predictable,
  // camera-visible dimensions in browser camera mode and sensible size in XR.
  const box = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  const targetSize = item.file.includes('burger') ? 0.14 : 0.28;
  const modelScale = targetSize / maxDim;
  model.scale.setScalar(modelScale);
  model.position.x -= center.x * modelScale;
  model.position.z -= center.z * modelScale;

  // Put the model's bottom on y=0 after scaling.
  const scaledMinY = box.min.y * modelScale;
  model.position.y -= scaledMinY;
  dishBaseSize = 1;

  model.traverse((n) => {
    if (n.isMesh) {
      n.frustumCulled = false;
      n.castShadow = true;
      if (n.material) {
        n.material.side = THREE.DoubleSide;
        n.material.depthWrite = true;
      }
    }
  });
  dishReady = true;
  setStatus('3D loaded — tap Start camera AR');
}, undefined, () => {
  setWarn('Could not load the 3D file. Keep the .glb next to this page.');
});

function modelURL() {
  return new URL(item.file, location.href).href;
}

async function detect() {
  const lines = [];
  const add = (name, ok, detail='') => lines.push(`<div class="${ok ? 'ok' : 'bad'}">${ok ? '✓' : '✗'} ${name}${detail ? ': ' + detail : ''}</div>`);

  add('HTTPS', isSecure, location.protocol);
  const hasXR = !!navigator.xr;
  add('WebXR API', hasXR);

  let ar = false;
  if (hasXR) {
    try { ar = await navigator.xr.isSessionSupported('immersive-ar'); }
    catch (e) { add('immersive-ar check', false, e.name || 'failed'); }
  }
  add('Immersive AR', ar);

  if (hasXR && ar) {
    let session = null;
    try {
      session = await navigator.xr.requestSession('immersive-ar', {
        requiredFeatures: ['local', 'hit-test'],
        optionalFeatures: ['anchors']
      });
      const enabled = Array.isArray(session.enabledFeatures) ? session.enabledFeatures : [];
      add('Hit-test session', enabled.includes('hit-test'), enabled.join(', ') || 'features not reported');
      add('Anchors', enabled.includes('anchors'), enabled.includes('anchors') ? 'supported' : 'optional / unavailable');
      await session.end();
      if (enabled.includes('hit-test')) {
        setStatus('True AR is supported — tap Start camera AR');
        setWarn('');
        diagEl.innerHTML = lines.join('');
        return;
      }
    } catch (e) {
      add('AR session', false, e.name || e.message || 'request failed');
      try { if (session) await session.end(); } catch {}
    }
  }

  setStatus('True table AR is not available in this browser');
  setWarn('This phone/browser is not exposing WebXR hit-test. A normal camera overlay cannot lock a dish to your real table.');
  startBtn.textContent = 'Check true AR again';
  diagEl.innerHTML = lines.join('');
}

detect();

startBtn.addEventListener('click', startAR);
resetBtn.addEventListener('click', () => {
  placed = false;
  previewOnCamera = true;
  reticle.visible = false;
  if (browserCameraMode) {
    dish.position.set(0, -0.10, -0.82);
    browserScale = 1;
    dish.scale.setScalar(browserScale);
    setStatus('Tap the screen to place the dish');
  } else {
    setStatus('Tap the table to place again');
  }
});

smallerBtn.addEventListener('click', () => { browserScale = Math.max(0.35, browserScale * 0.85); dish.scale.setScalar(browserScale); });
largerBtn.addEventListener('click', () => { browserScale = Math.min(2.5, browserScale * 1.18); dish.scale.setScalar(browserScale); });

function placeBrowserDish(clientX, clientY) {
  if (!browserCameraMode || !dishReady) return;
  const rect = canvas.getBoundingClientRect();
  browserPointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  browserPointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  browserRaycaster.setFromCamera(browserPointer, camera);

  const hit = new THREE.Vector3();
  if (browserRaycaster.ray.intersectPlane(browserPlacePlane, hit)) {
    // Keep the dish comfortably in front of the camera.
    hit.x = THREE.MathUtils.clamp(hit.x, -0.42, 0.42);
    hit.y = THREE.MathUtils.clamp(hit.y, -0.30, 0.35);
    dish.position.copy(hit);
    placed = true;
    setStatus('Dish placed — use + / − to resize');
  }
}

canvas.addEventListener('pointerdown', (e) => {
  if (!browserCameraMode) return;
  e.preventDefault();
  placeBrowserDish(e.clientX, e.clientY);
}, { passive: false });

function sceneViewerURL() {
  const file = modelURL();
  if (!file.startsWith('https://')) return null;
  return 'https://arvr.google.com/scene-viewer/1.0?mode=ar_preferred&title=' +
    encodeURIComponent(item.name) + '&file=' + encodeURIComponent(file);
}

async function startBrowserCamera() {
  if (!navigator.mediaDevices?.getUserMedia) {
    setWarn('This browser does not provide camera access.');
    return false;
  }
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    cameraVideo.srcObject = cameraStream;
    await cameraVideo.play();
    browserCameraMode = true;
    browserScale = 1;
    cameraVideo.style.display = 'block';
    scene.background = null;
    floor.visible = false;
    hintEl.classList.add('show');
    panelEl.style.display = 'none';
    cameraControls.style.display = 'flex';
    setStatus('Camera on — tap the screen to place the dish');
    setWarn('Browser camera mode works directly in Chrome without another app. It is a visual overlay, not full surface-tracking AR.');
    return true;
  } catch (err) {
    console.warn('Browser camera failed:', err);
    setWarn('Camera permission was denied or the camera is unavailable. Allow camera access and try again.');
    return false;
  }
}

function stopBrowserCamera() {
  if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
  cameraStream = null;
  cameraVideo.srcObject = null;
  cameraVideo.style.display = 'none';
  browserCameraMode = false;
  cameraControls.style.display = 'none';
}

async function launchSceneViewer() {
  return startBrowserCamera();
}

sceneBtn.addEventListener('click', () => launchSceneViewer());

async function requestARSession() {
  return await navigator.xr.requestSession('immersive-ar', {
    requiredFeatures: ['local', 'hit-test'],
    optionalFeatures: ['anchors']
  });
}

async function startAR() {
  if (!isSecure) {
    setWarn('Camera AR needs https. Publish this folder, then open the link on your phone.');
    return;
  }
  if (!navigator.xr) {
    setStatus('WebXR is not available');
    setWarn('This browser does not provide true AR. No floating camera mode is used.');
    diagEl.scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }

  setStatus('Asking for camera…');
  setWarn('');

  try {
    const session = await requestARSession();
    scene.background = null;
    floor.visible = false;
    previewOnCamera = true;
    placed = false;
    hintEl.classList.add('show');
    panelEl.style.display = 'none';
    renderer.xr.setSession(session);
    setStatus('Camera on — move over a table');

    session.addEventListener('end', () => {
      hitSource = null;
      latestHit = null;
      refSpaceForHit = null;
      if (xrAnchor) { try { xrAnchor.delete(); } catch {} xrAnchor = null; }
      scene.background = new THREE.Color(0x0c0906);
      floor.visible = true;
      hintEl.classList.remove('show');
      panelEl.style.display = '';
      dish.position.set(0, 0, 0);
      dish.quaternion.identity();
      camera.position.set(0.18, 0.16, 0.28);
      setStatus('AR closed');
    });

    session.addEventListener('select', async () => {
      if (!reticle.visible || !latestHit) {
        setStatus('Point at a table until the yellow ring appears');
        return;
      }
      const hit = latestHit;
      const pose = hit.getPose(refSpaceForHit || renderer.xr.getReferenceSpace());
      if (!pose) return;
      dish.position.setFromMatrixPosition(reticle.matrix);
      dish.position.y += item.yLift;
      const rot = new THREE.Quaternion();
      rot.setFromRotationMatrix(reticle.matrix);
      dish.quaternion.copy(rot);
      placed = true;
      previewOnCamera = false;
      if (hit.createAnchor) {
        try { xrAnchor = await hit.createAnchor(); setStatus('Placed on table — anchored in the real world'); }
        catch { setStatus('Placed on table — tracking without anchor'); }
      } else {
        setStatus('Placed on table — tracking in the real world');
      }
    });

    try {
      viewerSpace = await session.requestReferenceSpace('viewer');
      hitSource = await session.requestHitTestSource({ space: viewerSpace });
    } catch (hitError) {
      // A session without hit-test cannot do table placement reliably.
      try { await session.end(); } catch {}
      hitSource = null;
      latestHit = null;
      refSpaceForHit = null;
      if (xrAnchor) { try { xrAnchor.delete(); } catch {} xrAnchor = null; }
      throw new Error('Surface hit-test is unavailable on this device.');
    }
  } catch (err) {
    console.warn('WebXR AR failed:', err);
    setStatus('WebXR unavailable');

    setWarn('True AR could not start on this device/browser. The website will not use floating camera-overlay mode because that cannot stay attached to your table.');
    diagEl.innerHTML += `<div class="bad">✗ ${err.name || 'WebXR error'}: ${err.message || 'AR session failed'}</div>`;
  }
}

const previewOffset = new THREE.Vector3(0, -0.12, -0.42);
const _pos = new THREE.Vector3();
const _quat = new THREE.Quaternion();
const _scale = new THREE.Vector3();
const _mat = new THREE.Matrix4();

renderer.setAnimationLoop((time, frame) => {
  if (!renderer.xr.isPresenting) controls.update();

  if (browserCameraMode && !renderer.xr.isPresenting) {
    camera.position.set(0, 0, 0.1);
    camera.lookAt(0, 0, -1);
    if (!placed) {
      dish.position.set(0, -0.10, -0.82);
    }
    dish.scale.setScalar(browserScale);
  }

  if (frame && renderer.xr.isPresenting) {
    const refSpace = renderer.xr.getReferenceSpace();
    let gotHit = false;
    if (hitSource && refSpace) {
      const hits = frame.getHitTestResults(hitSource);
      if (hits.length) {
        latestHit = hits[0];
        refSpaceForHit = refSpace;
        const pose = hits[0].getPose(refSpace);
        if (pose) {
          reticle.visible = true;
          reticle.matrix.fromArray(pose.transform.matrix);
          gotHit = true;
          if (!placed) setStatus('Surface found — tap to set it down');
        }
      }
    }
    if (!gotHit) { reticle.visible = false; latestHit = null; }

    if (!placed && previewOnCamera) {
      const xrCam = renderer.xr.getCamera();
      xrCam.matrixWorld.decompose(_pos, _quat, _scale);
      const forward = previewOffset.clone().applyQuaternion(_quat);
      dish.position.copy(_pos).add(forward);
      dish.quaternion.copy(_quat);
    }
  }

  if (xrAnchor && frame && renderer.xr.isPresenting && frame.trackedAnchors) {
    const aPose = frame.getPose(xrAnchor.anchorSpace, renderer.xr.getReferenceSpace());
    if (aPose && placed) {
      _mat.fromArray(aPose.transform.matrix);
      _mat.decompose(dish.position, dish.quaternion, _scale);
      dish.position.y += item.yLift;
    }
  }

  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
